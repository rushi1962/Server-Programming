events {}

stream {
    # Docker's built-in DNS. Re-resolve names every 10s, so nginx follows the
    # game container to its new IP after a redeploy.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Remember connections per client IP (10 MB of memory for the table)
    limit_conn_zone $binary_remote_addr zone=perip:10m;

    # One line per connection: who, status, bytes each way, how long it lasted
    log_format game '$remote_addr [$time_local] status=$status '
                    'sent=$bytes_sent received=$bytes_received time=$session_time';
    access_log /dev/stdout game;
    error_log  /dev/stderr warn;

    server {
        listen 7777;
        # A variable makes nginx resolve the name per connection, not once at startup
        set $game_upstream cardgame:7777;
        proxy_pass $game_upstream;
        limit_conn perip 5;         # at most 5 connections at once per IP
    }
}