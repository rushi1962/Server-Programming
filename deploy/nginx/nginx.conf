events {}

stream {
    # Remember connections per client IP (10 MB of memory for the table)
    limit_conn_zone $binary_remote_addr zone=perip:10m;

    # One line per connection: who, status, bytes each way, how long it lasted
    log_format game '$remote_addr [$time_local] status=$status '
                    'sent=$bytes_sent received=$bytes_received time=$session_time';
    access_log /dev/stdout game;
    error_log  /dev/stderr warn;

    server {
        listen 7777;
        proxy_pass cardgame:7777;   # the game container, by its Compose service name
        limit_conn perip 5;         # at most 5 connections at once per IP
    }
}
