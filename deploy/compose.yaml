# Production stack for the card game server, deployed to /srv/cardgame by deploy.sh.
# The image version comes from .env on the server (CARDGAME_VERSION=x.y.z).
name: cardgame

services:
  cardgame:
    image: ghcr.io/rushi1962/cardgame-server:${CARDGAME_VERSION:?Set CARDGAME_VERSION in .env}
    # No "ports:": only nginx can reach it, inside the Compose network
    volumes:
      - cardgame-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/7777"]
      interval: 60s
      timeout: 3s
      retries: 3
      start_period: 30s
      start_interval: 2s

  proxy:
    image: nginx:1.27
    ports:
      - "7777:7777"                   # the only door from outside
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      cardgame:
        condition: service_healthy    # don't start until the game server is healthy
    restart: unless-stopped

volumes:
  cardgame-data:
    external: true                    # created once by hand; `down -v` can't delete it