name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PROJECT_DIR: ServerProgramming/CardGameTCPServer/CardGameTCPServer

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        # The project is deep in the repo; run every `run:` step from there.
        working-directory: ${{ env.PROJECT_DIR }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Install the .NET 8 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore NuGet packages
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

  smoke-test:
    needs: build              # only run if the build passed (fail fast)
    runs-on: ubuntu-latest
    timeout-minutes: 10       # a hung bot must not burn 6 hours of minutes
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Build the Docker image
        run: docker build -t cardgame-server:ci "$PROJECT_DIR"

      - name: Start the server
        run: docker run -d --name cardgame-test -p 7777:7777 cardgame-server:ci

      - name: Wait for port 7777
        run: |
          for i in $(seq 1 30); do
            if bash -c "echo > /dev/tcp/localhost/7777" 2>/dev/null; then
              echo "Server is up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "Server did not open port 7777 within 30s"; exit 1

      - name: Smoke test (4 bots)
        run: python3 tests/cardgame_bot.py localhost --port 7777 --bots 4

      - name: Restart the server
        run: docker restart cardgame-test

      - name: Wait for port 7777 after restart
        run: |
          for i in $(seq 1 30); do
            if bash -c "echo > /dev/tcp/localhost/7777" 2>/dev/null; then
              echo "Server is up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "Server did not open port 7777 within 30s"; exit 1

      - name: Smoke test after restart (2 bots)
        run: python3 tests/cardgame_bot.py localhost --port 7777 --bots 2

      - name: Server logs
        if: always()          # run even if a step above failed
        run: docker logs cardgame-test