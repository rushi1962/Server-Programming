name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        # The project is deep in the repo; run every `run:` step from there.
        working-directory: ServerProgramming/CardGameTCPServer/CardGameTCPServer
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Install the .NET 8 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore NuGet packages
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore