name: CI

on:
  push:
    branches: [main]
    tags: ['v*']              # a version tag also publishes the image
  pull_request:
    branches: [main]

env:
  PROJECT_DIR: ServerProgramming/CardGameTCPServer/CardGameTCPServer
  IMAGE: ghcr.io/rushi1962/cardgame-server

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        # The project is deep in the repo; run every `run:` step from there.
        working-directory: ${{ env.PROJECT_DIR }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Install the .NET 8 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore NuGet packages
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

  smoke-test:
    needs: build              # only run if the build passed (fail fast)
    runs-on: ubuntu-latest
    timeout-minutes: 10       # a hung bot must not burn 6 hours of minutes
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Build the Docker image
        run: docker build -t cardgame-server:ci "$PROJECT_DIR"

      # Same healthcheck as production: probe the port from INSIDE the container,
      # so docker-proxy can't answer for a server that isn't listening yet.
      - name: Start the server
        run: |
          docker run -d --name cardgame-test -p 7777:7777 \
            --health-cmd 'bash -c "echo > /dev/tcp/localhost/7777"' \
            --health-interval 2s --health-timeout 3s --health-retries 3 \
            cardgame-server:ci

      - name: Wait until healthy
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' cardgame-test)
            if [ "$status" = "healthy" ]; then
              echo "Server is healthy after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "Server not healthy within 30s (last status: $status)"; exit 1

      - name: Smoke test (4 bots)
        run: python3 tests/cardgame_bot.py localhost --port 7777 --bots 4

      - name: Restart the server
        run: docker restart cardgame-test

      - name: Wait until healthy after restart
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' cardgame-test)
            if [ "$status" = "healthy" ]; then
              echo "Server is healthy after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "Server not healthy within 30s (last status: $status)"; exit 1

      - name: Smoke test after restart (2 bots)
        run: python3 tests/cardgame_bot.py localhost --port 7777 --bots 2

      - name: Server logs
        if: always()          # run even if a step above failed
        run: docker logs cardgame-test

  publish:
    needs: smoke-test         # never publish an image that failed the smoke test
    if: startsWith(github.ref, 'refs/tags/v')   # only for version tags
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write         # least privilege: GITHUB_TOKEN may only push packages
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up QEMU (for the arm64 runtime stage)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the version from the tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.PROJECT_DIR }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          labels: org.opencontainers.image.source=https://github.com/rushi1962/Server-Programming