services:
  cardgame:
    build: .
    image: cardgame-server:compose
    # No "ports:" any more: only reachable inside the Compose network
    volumes:
      - cardgame-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/7777"]
      interval: 10s
      timeout: 3s
      retries: 3

  proxy:
    image: nginx:1.27
    ports:
      - "7777:7777"                   # the only door from outside
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      cardgame:
        condition: service_healthy    # don't start until the game server is healthy
    restart: unless-stopped

volumes:
  cardgame-data:
    name: cardgame-data
